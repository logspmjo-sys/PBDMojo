<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBD RMPM - Warehouse System</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { height: 100%; overflow: hidden; background-color: #0f172a; font-family: 'Segoe UI', sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
    #loading {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: #0f172a; display: flex; align-items: center; justify-content: center;
      flex-direction: column; color: #38bdf8; z-index: 9999; transition: opacity 0.5s ease;
    }
    .spinner {
      width: 50px; height: 50px; border: 4px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 14px; color: #94a3b8; letter-spacing: 1px; }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <div class="loading-text">Memuat Dashboard RMPM...</div>
  </div>

  <!-- ✅ PERHATIKAN: Ada ?page=dash di akhir URL -->
  <iframe 
    id="mainFrame"
    src="https://script.google.com/macros/s/AKfycbyzQ2mVxd_8fNde-Edb0QeXthWeVglZfV-zhmd-j_zIHbduIk9ALUiED-EN0CzwelVf/exec?page=dash"
    allow="fullscreen; clipboard-write"
    onload="hideLoading();">
  </iframe>

  <script>
    function hideLoading() {
      const loading = document.getElementById('loading');
      loading.style.opacity = '0';
      setTimeout(() => { loading.style.display = 'none'; }, 500);
    }
  </script>
</body>
</html>
